[mypy]
python_version = 3.12
plugins = mypy_django_plugin.main
ignore_missing_imports = True
check_untyped_defs = True

[mypy.plugins.django-stubs]
django_settings_module = config.settings.dev

[mypy-*.migrations.*]
ignore_errors = True

# factory_boy's DjangoModelFactory isn't typed to narrow __new__'s return to
# Meta.model, so every factory call reads as the factory class itself.
[mypy-*.tests.*]
ignore_errors = True
